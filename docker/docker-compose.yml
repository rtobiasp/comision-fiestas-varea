services:
  postgres:
    image: postgres:16-alpine
    container_name: fiestas-varea-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fiestas_varea}
      POSTGRES_USER: ${POSTGRES_USER:-fiestas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiestas_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fiestas} -d ${POSTGRES_DB:-fiestas_varea}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Herramienta visual opcional. Se levanta solo con --profile tools:
  #   docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: fiestas-varea-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: fiestas-varea-postgres-data
  pgadmin_data:
    name: fiestas-varea-pgadmin-data
